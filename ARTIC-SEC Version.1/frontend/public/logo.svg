<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M50 5 L88 20 C88 60 50 92 50 95 C50 92 12 60 12 20 Z" 
        fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Circuit Nodes & Core -->
  <path d="M50 22 L72 34 C72 60 50 78 50 80 C50 78 28 60 28 34 Z" 
        fill="#080e1a" stroke="#0ea5e9" stroke-width="1.5" opacity="0.85" />
  <!-- Cyber Hexagon Center -->
  <polygon points="50,38 60,44 60,56 50,62 40,56 40,44" 
           fill="#0369a1" stroke="url(#glowGrad)" stroke-width="2" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#38bdf8" />
  <!-- Digital Traces -->
  <line x1="50" y1="22" x2="50" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="40" y1="50" x2="28" y2="50" stroke="#0284c7" stroke-width="1.5" />
  <line x1="60" y1="50" x2="72" y2="50" stroke="#0284c7" stroke-width="1.5" />
  <line x1="50" y1="62" x2="50" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
